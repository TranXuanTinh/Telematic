[system]
compatible=sa515m-s32k144-revB
bootloader=uboot
data-directory=/data/rauc

[keyring]
path=/factory/ota-ca.cert.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=ext4
bootname=B

[slot.boot.0]
device=/dev/disk/by-partlabel/boot_a
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-partlabel/boot_b
type=vfat
parent=rootfs.1

