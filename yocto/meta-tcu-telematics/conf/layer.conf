# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tcu-telematics"
BBFILE_PATTERN_meta-tcu-telematics = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tcu-telematics = "10"

LAYERDEPENDS_meta-tcu-telematics = "core openembedded-layer networking-layer rauc"
LAYERSERIES_COMPAT_meta-tcu-telematics = "kirkstone scarthgap"

